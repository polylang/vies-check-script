name: VIES monitor

on:
  schedule:
    - cron: '0 9,14 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

concurrency:
  group: vies-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A cache entry cannot be updated. A unique key misses every run, restore-keys
      # loads the latest state, and a successful job saves that state under the new key.
      - name: Restore status state
        uses: actions/cache@v4
        with:
          path: vies-status-state.json
          key: vies-status-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vies-status-state-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl

      - name: Run monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: php monitor.php

      - name: Notify Slack on failure
        if: failure() && !cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo 'SLACK_WEBHOOK_URL is not set; skipping failure notification.'
            exit 0
          fi
          text=$(printf '%s\n' \
            '*VIES monitor failed*' \
            'Workflow: ${{ github.workflow }}' \
            'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          payload=$(jq -n --arg text "$text" '{text: $text}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"